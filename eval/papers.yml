# ---------------------------------------------------------------------------
# Eval metadata
# ---------------------------------------------------------------------------

stratification:
  by_subdomain:
    extremal_combinatorics: [wagner-2019-lp-refutation, cranston-rabern-2016-steinberg, cranston-rabern-steiner-2022-woodall]
    probabilistic_combinatorics: [gladkov-pak-zimin-2024-bunkbed]
    algebraic_combinatorics: [duval-goeckner-klivans-martin-2015-partitionability]
    number_theory: [bell-shallit-2022-dombi]
  by_kind:
    trap: 25
    control: 9
    total: 34

success_criteria:
  vanilla_baseline:
    description: >
      What we expect the LangChain-quickstart baseline to do on trap queries.
    expected_failure_rate: ">= 0.7"
    rationale: >
      Vanilla RAG should confidently report the conjectured bound on most
      trap queries. If it gets >30% right by accident, the queries aren't
      tight enough and need recalibrating against the actual ingested PDFs.
  anchor:
    description: >
      What we expect Anchor to do on the same queries.
    expected_correct_stance_rate: ">= 0.8"
    expected_role_recovery_rate: ">= 0.6"
    rationale: >
      Anchor should refuse to assert the disproven claim on at least 80% of
      trap queries (correct stance), and should surface the
      STEELMAN_REFUTED_LATER role on at least 60% of retrieved chunks for
      those queries (role recovery). Role recovery is the harder metric and
      a more direct test of the structural-information thesis.

caveats:
  - "This is a worked-example suite, not a benchmark. 6 papers and 38 queries is too small to publish numbers from."
  - "Math papers are a friendly domain — argumentative role is textually marked. Generalization to other domains is unvalidated."
  - "Equations may render poorly via PDFBox+Tika. Both pipelines see the same garbled LaTeX, so the comparison is fair, but absolute answer quality on equation-heavy queries will suffer."
  - "Trap queries were authored to lexically match the conjecture-statement chunk. They are deliberately calibrated to expose the failure mode; an 'in-the-wild' query mix would have a lower trap rate."
  - "Control queries are honest, not gimmes. They test that Anchor doesn't over-hedge — a system that always hedges would 'pass' all trap queries by accident."
