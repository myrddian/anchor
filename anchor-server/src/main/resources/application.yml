spring:
  application:
    name: anchor-server
  servlet:
    multipart:
      # PDFs of papers run a few MB; the default 1MB is too tight. 50MB covers
      # textbook chapters and most preprints without inviting abuse on a
      # local-only service.
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    # Default points at the docker-compose stack which binds host 5433 to
    # avoid collision with other local postgres (e.g. VoidCore on 5432).
    url: ${ANCHOR_DB_URL:jdbc:postgresql://localhost:5433/anchor}
    username: ${ANCHOR_DB_USER:anchor}
    password: ${ANCHOR_DB_PASSWORD:anchor}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.lob.non_contextual_creation: true
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  web:
    resources:
      # Lockstep with anchor.web-ui.enabled — turning off the UI 404s the
      # static asset handler so /, /index.html, /anchor.js, /anchor.css don't
      # resolve at all on API-only deployments.
      add-mappings: ${ANCHOR_WEB_UI_ENABLED:true}

server:
  port: ${ANCHOR_PORT:8090}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # Anchor is a local single-tenant tool — always surface the LM Studio /
      # database probe details so misconfiguration is obvious without log diving.
      show-details: always
      show-components: always

# Inference provider. Anchor speaks the OpenAI chat-completions and embeddings
# wire format — works with LM Studio (the dev default), real OpenAI, vLLM,
# llama.cpp's HTTP server, ollama's OpenAI-compat shim, anything that follows
# the same shape. The env vars are named generically; LM_STUDIO_* still
# resolves as a back-compat fallback so existing .env files keep working.
lmstudio:
  base-url: ${LLM_BASE_URL:${LM_STUDIO_BASE_URL:http://mac-studio.local:1234/v1}}
  chat-model: ${LLM_CHAT_MODEL:${LM_STUDIO_CHAT_MODEL:gemma-3-4b-it}}
  embedding-model: ${LLM_EMBEDDING_MODEL:${LM_STUDIO_EMBEDDING_MODEL:nomic-embed-text-v1.5}}
  embedding-dim: 768
  # Bearer token for the OpenAI-compatible endpoint. Empty for vanilla local
  # LM Studio; set when pointing at a provider that requires auth. Kept under
  # the LM_STUDIO_API_KEY name on purpose — Anthropic vs OpenAI key semantics
  # diverge enough that a generic name would invite confusion.
  api-key: ${LM_STUDIO_API_KEY:}
  timeouts:
    blocking-seconds: 60
    streaming-seconds: 90
    embedding-seconds: 30
  retry:
    max-attempts: 2
    initial-backoff-ms: 500

# Worker pool sizes — see SPEC §7.9.
worker:
  chat:
    pool-size: ${WORKER_CHAT_POOL_SIZE:1}
  embedding:
    pool-size: ${WORKER_EMBEDDING_POOL_SIZE:2}
  deliberation:
    pool-size: ${WORKER_DELIBERATION_POOL_SIZE:4}
  ingest:
    pool-size: ${WORKER_INGEST_POOL_SIZE:1}
  shutdown-timeout-seconds: ${WORKER_SHUTDOWN_TIMEOUT_SECONDS:30}

# Job store retention. ISO-8601 durations so Spring @Scheduled parses cleanly.
jobs:
  retention-after-completion: PT2H
  watchdog-interval: PT10M

# Ingest defaults.
ingest:
  chunk-target-tokens: 300
  abstract-min-words: 100

# Where browser-uploaded PDFs land before they're parsed. Per-upload UUID
# subdirs are created here automatically. Override with ANCHOR_UPLOAD_DIR.
anchor:
  upload-dir: ${ANCHOR_UPLOAD_DIR:${user.home}/.anchor/uploads}
  # Bearer token enforced on every request when non-empty. Empty default keeps
  # the dev / single-host workflow open; set ANCHOR_API_TOKEN before exposing
  # the service beyond localhost. See SecurityConfig for exempt paths.
  api-token: ${ANCHOR_API_TOKEN:}
  # Single-page browser UI. On by default for the dev / chemist demo workflow;
  # set ANCHOR_WEB_UI_ENABLED=false on API-only deployments. When this is on AND
  # api-token is set, the UI shows a token-prompt screen on load and attaches
  # the bearer to every request including the deliberation stream.
  web-ui:
    enabled: ${ANCHOR_WEB_UI_ENABLED:true}

# OpenAPI / Swagger UI. Enabled in v0 because the spec is the contract — useful
# for SDK consumers, integrators, and the curl-the-API audience. Set
# ANCHOR_OPENAPI_ENABLED=false to drop both endpoints on hardened deployments.
# Paths are the springdoc defaults: spec at /v3/api-docs, UI at
# /swagger-ui/index.html (also reachable via the /swagger-ui.html alias).
springdoc:
  api-docs:
    enabled: ${ANCHOR_OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${ANCHOR_OPENAPI_ENABLED:true}
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

# Ask deliberation defaults.
ask:
  retrieval:
    top-sections: 5
    top-chunks-per-section: 3
  temperatures:
    proposer: 0.3
    critic: 0.0
    synthesiser: 0.2

logging:
  level:
    root: INFO
    io.aeyer.anchor: INFO
    org.hibernate.SQL: WARN
