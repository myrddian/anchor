# GitHub Issues template config — controls the "New issue" picker.
#
# - blank_issues_enabled: false forces every issue through one of the
#   structured templates above. Keeps triage cheap; unstructured "ideas"
#   land in Discussions if they ever exist.
# - contact_links surface the dedicated channels for things that aren't
#   issues — security reports and Code of Conduct concerns both go
#   through GitHub's private advisory flow, NOT a public issue.

blank_issues_enabled: false

contact_links:
  - name: Security report
    url: https://github.com/myrddian/anchor/security/advisories/new
    about: |
      Vulnerabilities, auth bypasses, and similar must NOT be filed as public
      issues. Use the private advisory flow — see SECURITY.md for scope and
      what to include.

  - name: Code of Conduct concern
    url: https://github.com/myrddian/anchor/security/advisories/new
    about: |
      Reports of abusive, harassing, or otherwise unacceptable behaviour
      go through the same private advisory channel as security reports —
      it's the only confidential maintainer channel GitHub offers.
      See CODE_OF_CONDUCT.md.

  - name: Question or discussion
    url: https://github.com/myrddian/anchor/discussions
    about: |
      Open-ended questions, design discussion, "is this the right approach?"
      style threads. (If GitHub Discussions isn't enabled on the repo yet,
      open a regular issue with the "question" label and we'll triage from
      there.)
