services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: anchor-postgres
    environment:
      POSTGRES_DB: anchor
      POSTGRES_USER: anchor
      POSTGRES_PASSWORD: anchor
    ports:
      # Host 5433 so we don't fight another postgres bound to 5432
      # (e.g. the project-default postgres used by VoidCore).
      - "5433:5432"
    volumes:
      - anchor-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anchor -d anchor"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional: bring up the Anchor server itself in a container next to the
  # database. `docker compose up postgres` keeps the historical "just the
  # database" workflow for `./gradlew :anchor-server:bootRun` against host
  # JVM. `docker compose --profile app up --build` builds and runs the full
  # stack together.
  anchor-server:
    build: .
    image: anchor-server:dev
    container_name: anchor-server
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ANCHOR_DB_URL: jdbc:postgresql://postgres:5432/anchor
      ANCHOR_DB_USER: anchor
      ANCHOR_DB_PASSWORD: anchor
      # Inference defaults assume LM Studio on the host, reached via the
      # Docker Desktop / Podman host alias. Override with -e LLM_BASE_URL=...
      # to point at a real OpenAI-compatible endpoint anywhere on the LAN.
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:1234/v1}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-gemma-3-4b-it}
      LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-nomic-embed-text-v1.5}
      LM_STUDIO_API_KEY: ${LM_STUDIO_API_KEY:-}
      ANCHOR_API_TOKEN: ${ANCHOR_API_TOKEN:-}
      ANCHOR_WEB_UI_ENABLED: ${ANCHOR_WEB_UI_ENABLED:-true}
      ANCHOR_OPENAPI_ENABLED: ${ANCHOR_OPENAPI_ENABLED:-true}
      # Point at the sidecar Jaeger (in the same compose network) instead of
      # localhost — inside the container, localhost is the container itself.
      # Override at runtime to hit a different collector. When the
      # observability profile isn't activated, the override below points at
      # nothing reachable and the OTLP exporter retries-and-drops; harmless.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318/v1/traces}
    ports:
      - "8090:8090"
    volumes:
      # Persist uploads between container restarts so re-ingest
      # idempotency holds across `docker compose down`.
      - anchor-uploads:/app/uploads
    extra_hosts:
      # Linux Docker doesn't auto-resolve host.docker.internal; this maps it
      # explicitly so LM Studio on the host is reachable the same way it is
      # on Mac/Windows.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Observability stack. Joined to BOTH the 'app' and 'observability' profiles
  # so:
  #   docker compose up                              → just postgres (the
  #     historical dev workflow — server runs via `gradle bootRun` on the host
  #     JVM, no observability noise)
  #   docker compose --profile app up --build        → kitchen sink — postgres
  #     + server + jaeger + prometheus, everything pre-wired and reachable
  #   docker compose --profile observability up      → postgres + observability
  #     only, useful when you want bootRun + traces but don't need the
  #     containerised server
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: anchor-jaeger
    profiles: ["app", "observability"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # UI: http://localhost:16686
      - "4318:4318"    # OTLP/HTTP — anchor-server's default OTEL_EXPORTER_OTLP_ENDPOINT
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: anchor-prometheus
    profiles: ["app", "observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      # Lets the prometheus scrape job reach the host JVM (gradle bootRun)
      # via host.docker.internal — when running anchor-server in-container,
      # the same alias resolves to the right thing on the docker network.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  anchor-postgres-data:
  anchor-uploads:
