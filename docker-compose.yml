services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: anchor-postgres
    environment:
      POSTGRES_DB: anchor
      POSTGRES_USER: anchor
      POSTGRES_PASSWORD: anchor
    ports:
      # Host 5433 so we don't fight another postgres bound to 5432
      # (e.g. the project-default postgres used by VoidCore).
      - "5433:5432"
    volumes:
      - anchor-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anchor -d anchor"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  anchor-postgres-data:
